<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whisper — A quiet room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0f0f0f',
            surface: '#1a1a1a',
            text: '#e8e4dc',
            muted: '#6b6762',
            sage: '#8A9A5B',
            rose: '#E5C1CD',
            gold: '#C9A84C',
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/whisper.css" />
</head>
<body class="bg-bg text-text font-sans min-h-screen noise">

  <!-- Ambient glow -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[500px] h-[250px]"
         style="background: radial-gradient(ellipse, #E5C1CD 0%, transparent 70%); opacity: 0.02;"></div>
  </div>

  <div class="relative z-10 max-w-xl mx-auto px-6 py-10">

    <!-- Owner identity -->
    <header class="text-center mb-12">
      <div class="flex justify-center mb-4">
        <!-- Photo avatar -->
        <img
          id="photo-avatar"
          src=""
          alt=""
          class="hidden w-20 h-20 rounded-full object-cover"
          style="border: 1px solid rgba(229,193,205,0.15);"
        />
        <!-- Sigil (shown if no photo) -->
        <div id="sigil-container" class="sigil-container opacity-80"></div>
      </div>
      <h1 id="ghost-name" class="font-serif text-2xl text-text font-normal mb-2"></h1>
      <p class="text-muted text-sm font-light">has opened their quiet room</p>
    </header>

    <!-- Board full message -->
    <div id="board-full-msg" class="hidden mb-8 text-center">
      <div class="bg-surface rounded-2xl p-6 border border-surface">
        <p class="font-serif text-muted italic text-base leading-relaxed">
          The room is full. The owner must clear the air before new whispers can arrive.
        </p>
      </div>
    </div>

    <!-- Integrated whispers -->
    <div id="whispers-list" class="space-y-3 mb-8">
      <!-- Rendered by app.js -->
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden mb-8 text-center py-12">
      <div class="inline-block w-12 h-12 rounded-full mb-4 breathe"
           style="background: radial-gradient(circle, rgba(138,154,91,0.15) 0%, transparent 70%); border: 1px solid rgba(138,154,91,0.1);"></div>
      <p class="font-serif text-muted italic text-lg">Silence is heavy.</p>
      <p class="text-muted text-sm mt-1 font-light">Leave the first whisper.</p>
    </div>

    <!-- Leave a whisper button -->
    <div class="text-center">
      <button
        id="leave-whisper-btn"
        class="px-10 py-4 rounded-2xl font-sans text-sm tracking-widest uppercase transition-all duration-300"
        style="background: rgba(229,193,205,0.08); color: #E5C1CD; border: 1px solid rgba(229,193,205,0.2); letter-spacing: 0.1em;"
        onmouseover="this.style.background='rgba(229,193,205,0.15)'"
        onmouseout="this.style.background='rgba(229,193,205,0.08)'"
      >
        Leave a whisper
      </button>
    </div>

    <!-- Attribution -->
    <p class="text-center text-muted/30 text-xs mt-12 font-light">
      <a href="index.html" class="hover:text-muted/50 transition-colors">Open your own quiet room →</a>
    </p>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
