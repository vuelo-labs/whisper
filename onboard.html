<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whisper — Your quiet room awaits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0f0f0f',
            surface: '#1a1a1a',
            text: '#e8e4dc',
            muted: '#6b6762',
            sage: '#8A9A5B',
            rose: '#E5C1CD',
            gold: '#C9A84C',
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/whisper.css" />
  <style>
    .photo-upload-ring {
      border: 1.5px dashed rgba(138,154,91,0.25);
      transition: border-color 0.3s ease, background 0.3s ease;
    }
    .photo-upload-ring:hover {
      border-color: rgba(138,154,91,0.5);
      background: rgba(138,154,91,0.04);
    }
  </style>
</head>
<body class="bg-bg text-text font-sans min-h-screen noise">

  <!-- Ambient orb -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-96 h-96 rounded-full"
         style="background: radial-gradient(circle, #8A9A5B 0%, transparent 70%); opacity: 0.025;"></div>
  </div>

  <main class="relative z-10 min-h-screen flex flex-col items-center justify-center px-6 py-16">

    <div class="w-full max-w-sm">

      <!-- Sigil mark -->
      <div class="flex justify-center mb-8">
        <div id="onboard-sigil" class="opacity-60"></div>
      </div>

      <!-- Heading -->
      <div class="text-center mb-10">
        <h1 class="font-serif text-3xl text-text font-normal mb-3" style="letter-spacing: -0.01em;">
          Your quiet room awaits.
        </h1>
        <p class="text-muted text-sm font-light leading-relaxed">
          Before you enter — what shall we call you?
        </p>
      </div>

      <form id="onboard-form" class="space-y-8" novalidate>

        <!-- Name -->
        <div>
          <input
            id="name-input"
            type="text"
            placeholder="your name"
            autocomplete="name"
            autocorrect="off"
            maxlength="60"
            class="email-input-glow w-full bg-surface border border-transparent rounded-2xl px-5 py-4 text-text placeholder-muted font-sans font-light text-base focus:border-sage/20 transition-all text-center"
            style="background: rgba(26,26,26,0.8);"
          />
          <p class="text-muted/40 text-xs text-center mt-2 font-light">This is how people will know whose room they're visiting.</p>
        </div>

        <!-- Photo upload (optional) -->
        <div class="text-center">
          <p class="text-muted text-xs uppercase tracking-widest mb-4">A face, if you wish</p>

          <label for="photo-input" class="cursor-pointer block">
            <div class="relative w-24 h-24 rounded-full mx-auto photo-upload-ring flex items-center justify-center overflow-hidden"
                 style="background: rgba(26,26,26,0.6);">
              <img
                id="photo-preview"
                src=""
                alt="Your photo"
                class="hidden w-full h-full object-cover rounded-full"
              />
              <div id="photo-placeholder" class="text-center px-2">
                <div class="text-muted/40 text-xl mb-1">+</div>
                <span class="text-muted/40 text-xs font-light">photo</span>
              </div>
            </div>
          </label>

          <input
            id="photo-input"
            type="file"
            accept="image/*"
            class="sr-only"
          />

          <p class="text-muted/30 text-xs mt-3 font-light">Optional. Stored only on your device for now.</p>
        </div>

        <!-- Submit -->
        <button
          id="onboard-submit"
          type="submit"
          disabled
          class="w-full py-4 rounded-2xl font-sans font-normal text-sm tracking-widest uppercase transition-all duration-300 disabled:opacity-30"
          style="background: rgba(138,154,91,0.1); color: #8A9A5B; border: 1px solid rgba(138,154,91,0.2); letter-spacing: 0.12em;"
          onmouseover="if(!this.disabled) this.style.background='rgba(138,154,91,0.18)'"
          onmouseout="this.style.background='rgba(138,154,91,0.1)'"
        >
          Step into the silence
        </button>

      </form>

    </div>

  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
